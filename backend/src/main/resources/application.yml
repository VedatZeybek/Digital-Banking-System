spring:
  application:
    name: banking-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/banking}
    username: ${DB_USERNAME:banking}
    password: ${DB_PASSWORD:banking}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
      timeout: 30m

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}

